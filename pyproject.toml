[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reviewer"
version = "0.2.0"
description = "Multi-agent reviewer for staged git changes."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "langchain[mcp]>=1.4.0",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "mcp>=2.0",
    # Imported at module scope by reviewer/mcp/github_client.py and the
    # fs_server; previously only present as a transitive dependency, so a
    # clean `pip install .` produced an ImportError on first run.
    "fastmcp>=4.0",
    # reviewer/core/tracer.py
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "anyio>=4.0", "ruff>=0.14", "mypy>=1.14"]
# The GitHub App bot. Kept separate so the CLI stays installable without a
# database, a web server, or a Redis client.
bot = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "redis>=5.2",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
]

[project.scripts]
# The original CLI, now archived under legacy/ — see legacy/README.md.
# Kept working so the engine has a second consumer and cannot quietly grow
# a dependency on the bot.
reviewer = "legacy.reviewer_cli.cli:app"
reviewer-fs-server = "legacy.reviewer_cli.mcp.fs_server_main:main"

[tool.hatch.build.targets.wheel]
packages = ["reviewer", "bot", "legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Explicit, so CI does not drift when ruff changes its default rule set.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ISC", "PLW"]
ignore = [
    # Line length is the formatter's concern, and the explanatory comments in
    # this codebase are deliberately long-form.
    "E501",
    # `typer.Option(...)` in an argument default is how Typer declares a CLI.
    # Obeying B008 would mean rewriting every command signature.
    "B008",
    # Nested `with` is sometimes the clearer read, especially in tests that
    # nest a tracer scope inside an executor.
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
# Test helpers commonly unpack a tuple and use only part of it.
"tests/*" = ["RUF059"]
# cli.py must call load_dotenv() BEFORE importing anything that reads
# os.environ at import time (reviewer/config.py does). The import order is
# load-bearing, so E402 is wrong about this file specifically.
"legacy/reviewer_cli/cli.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["reviewer", "bot"]
ignore_missing_imports = true
# This codebase has never been type-checked. CI reports mypy without failing
# on it (see .github/workflows/ci.yml); tighten these as the errors come down.
warn_unused_ignores = false
check_untyped_defs = false
